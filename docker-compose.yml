services:
  api:
    build:
      context: .
    ports:
      - "5105:5105"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:5105
      Security__ApiKey: ${Security__ApiKey:?Set Security__ApiKey to at least eight characters}
      ConnectionStrings__Loyalty: Data Source=/app/appdata/loyalty-engine.db
      ConnectionStrings__Redis: ${ConnectionStrings__Redis-redis:6379}
    volumes:
      - loyalty-data:/app/appdata
    depends_on:
      redis:
        condition: service_healthy
  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  loyalty-data:
